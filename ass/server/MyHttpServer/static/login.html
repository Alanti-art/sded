<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в админ-панель — Переворот</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 18px;
      line-height: 1.5;
      background: #070F08;
      color: #B6A8A2;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -40px;
      z-index: -1;
      background: url("https://filgroup.ru/wp-content/uploads/2024/07/22.-Perevorot.webp") center / cover;
      filter: blur(14px) brightness(0.3);
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: 760px;
      max-width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      background: #090c0c;
    }

    .header {
      padding: 14px 28px;
      border-bottom: 1px solid #7A4A3C;
      text-align: center;
    }

    .logo { color: #D8CCC6; font-size: 22px; font-weight: bold; }

    .login-box {
      width: 460px;
      max-width: 100%;
      margin: 90px auto;
      padding: 30px;
      border: 1px solid #7A4A3C;
      border-radius: 14px;
    }

    h1 { margin-top: 0; color: #D8CCC6; font-size: 34px; text-align: center; }

    label { display: block; margin-top: 18px; color: #D8CCC6; font-weight: bold; }

    input {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      font: inherit;
      color: #D8CCC6;
      background: #090c0c;
      border: 1px solid #7A4A3C;
      border-radius: 8px;
    }

    .error {
      margin-top: 18px;
      padding: 10px 12px;
      color: #D8CCC6;
      border-left: 2px solid #7A4A3C;
    }

    .btn {
      width: 100%;
      margin-top: 26px;
      padding: 10px;
      font: inherit;
      font-weight: bold;
      color: #D8CCC6;
      cursor: pointer;
      background: transparent;
      border: 1px solid #D8CCC6;
      border-radius: 999px;
    }

    .btn:hover { color: #090c0c; background: #D8CCC6; }

    .back { display: block; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <a class="logo" href="/">♛ Переворот</a>
    </div>

    <form class="login-box" id="loginForm" action="/auth/login" method="post">
      <h1>Вход в админ-панель</h1>
      <p style="text-align:center; font-size:15px; margin:5px 0 0;">Логин: student &nbsp; Пароль: test123</p>

      <label for="login">Логин</label>
      <input id="login" name="login" type="text" required>

      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required>

      <div id="error" class="error" style="display:none"></div>

      <button class="btn" type="submit">Войти</button>
      <a class="back" href="/">← Вернуться на сайт</a>
    </form>
  </div>
<script>
(function(){
  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('error');
  // если уже авторизован — сразу на главную
  fetch('/auth/status', {credentials:'same-origin'}).then(r=>r.json()).then(j=>{
    const isAuth = j.IsAuthenticated ?? j.isAuthenticated ?? false;
    if(isAuth) location.href='/';
  }).catch(()=>{});
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    errorEl.style.display='none';
    const login = document.getElementById('login').value;
    const password = document.getElementById('password').value;
    const body = 'login='+encodeURIComponent(login)+'&password='+encodeURIComponent(password);
    try{
      const res = await fetch('/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: body,
        credentials:'same-origin'
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && (data.Success || data.success)){
        location.href='/';
      } else {
        const msg = data.Message || data.message || 'Неверный логин или пароль';
        errorEl.textContent = msg;
        errorEl.style.display='block';
      }
    }catch(err){
      errorEl.textContent='Ошибка соединения';
      errorEl.style.display='block';
    }
  });
})();
</script>
</body>
</html>
