<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новая карточка — Переворот</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 18px;
      line-height: 1.5;
      background: #070F08;
      color: #B6A8A2;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: 760px;
      max-width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      background: #090c0c;
    }

    .header {
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #7A4A3C;
    }

    .logo { color: #D8CCC6; font-size: 22px; font-weight: bold; }
    .navigation a { margin-left: 20px; }
    .container { padding: 30px 28px 50px; }
    h1 { margin-top: 0; color: #D8CCC6; font-size: 38px; }

    label {
      display: block;
      margin-top: 18px;
      color: #D8CCC6;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      font: inherit;
      color: #D8CCC6;
      background: #090c0c;
      border: 1px solid #7A4A3C;
      border-radius: 8px;
    }

    textarea { min-height: 90px; resize: vertical; }

    .hint { margin: 5px 0 0; font-size: 15px; }

    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 9px 24px;
      color: #D8CCC6;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      background: transparent;
      border: 1px solid #D8CCC6;
      border-radius: 999px;
    }

    .btn:hover { color: #090c0c; background: #D8CCC6; }
    .back { margin-left: 16px; }

    .footer {
      padding: 26px 28px;
      border-top: 1px solid #7A4A3C;
      font-size: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <a class="logo" href="/">♛ Переворот</a>
      <div class="navigation"><a href="/cards.html">К карточкам</a><a href="#" id="logout-link" class="login-link">Выйти</a></div>
    </div>

    <div class="container">
      <h1>Новая карточка</h1>

      <form action="/admin/cards/create" method="post">
        <label for="name">Имя</label>
        <input id="name" name="Name" type="text" required>

        <label for="image">Путь или ссылка на изображение</label>
        <input id="image" name="Image" type="text" required>
        <p class="hint">Например: /static/assets/cards/duke.png</p>

        <label for="description">Короткое описание</label>
        <textarea id="description" name="Description" required></textarea>

        <label for="action">Действие</label>
        <textarea id="action" name="Action" required></textarea>

        <label for="cost">Стоимость</label>
        <input id="cost" name="Cost" type="text" value="Нет" required>

        <label for="blocks">Блокирует</label>
        <input id="blocks" name="Blocks" type="text" value="Ничего" required>

        <label for="blocked-by">Блокируется</label>
        <input id="blocked-by" name="BlockedBy" type="text" value="Никем" required>

        <label for="note">Примечание</label>
        <textarea id="note" name="Note"></textarea>

        <button class="btn" type="submit">Сохранить карточку</button>
        <a class="back" href="/cards.html">Отмена</a>
      </form>
    </div>

    <div class="footer">♛ Админ-панель игры «Переворот»</div>
  </div>

<script>
fetch('/auth/status')
  .then(function(r){ return r.json(); })
  .then(function(data){
    var isAuth = data.IsAuthenticated || data.isAuthenticated;
    if (!isAuth) {
      location.href = '/auth/login';
      return;
    }
    var logout = document.getElementById('logout-link');
    if (logout) {
      logout.onclick = function(e){
        e.preventDefault();
        fetch('/auth/logout', {method: 'POST'}).then(function(){ location.href = '/'; });
      };
    }
  });
</script>

</body>
</html>
